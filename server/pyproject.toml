[project]
name = "airkeep-relay"
version = "0.5.0"
description = "Local Bambu MQTT telemetry, history, humidity alerts and Apple push relay"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.120,<1",
    "uvicorn>=0.38,<1",
    "airkeep",
    "httpx[http2]>=0.28,<1",
    "pyjwt[crypto]>=2.10,<3",
    "pydantic-settings>=2.11,<3",
    "argon2-cffi>=25,<26",
    "python-dotenv>=1.2.4,<2",
    "psycopg[binary,pool]>=3.2,<4",
    "cryptography>=46,<51",
]

[tool.uv.sources]
airkeep = { path = "../agent" }

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
