# HTTP on host port 8080 for a reverse proxy.
name: airkeep
services:
  airkeep-relay:
    image: ${AIRKEEP_RELAY_IMAGE:-ghcr.io/danohn/airkeep-relay}:${AIRKEEP_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      AIRKEEP_DB_PATH: /data/airkeep.sqlite3
    expose: ['8787']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 256m
    pids_limit: 64
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      default:
        aliases:
          # Published web images use this hostname for the relay.
          - airkeep
    volumes:
      - airkeep-data:/data
      - type: bind
        source: ./private/apns
        target: /run/keys
        read_only: true
        bind:
          create_host_path: false
  airkeep-web:
    image: ${AIRKEEP_WEB_IMAGE:-ghcr.io/danohn/airkeep-web}:${AIRKEEP_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    depends_on:
      airkeep-relay:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    mem_limit: 128m
    pids_limit: 32
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports:
      - '8080:8080'
volumes:
  airkeep-data:
