name: Airkeep
options:
  bundleIdPrefix: io.airkeep
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
    watchOS: '26.0'
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.3.0'
    CURRENT_PROJECT_VERSION: '4'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Debug:
      APNS_ENVIRONMENT: development
    Release:
      APNS_ENVIRONMENT: production
targets:
  Airkeep-iOS:
    type: application
    platform: iOS
    sources: [Shared, App, iOS, WatchShared/WatchState.swift, AppIcon.icon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIRKEEP_BUNDLE_ID_PREFIX)
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Airkeep.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AirkeepWidgets-iOS
      - target: Airkeep-watchOS
        embed: true
  Airkeep-macOS:
    type: application
    platform: macOS
    sources: [Shared, App, macOS, AppIcon.icon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIRKEEP_BUNDLE_ID_PREFIX).mac
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/Airkeep.entitlements
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AirkeepWidgets-macOS
  AirkeepWidgets-iOS:
    type: app-extension
    platform: iOS
    sources: [Shared, Widgets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIRKEEP_BUNDLE_ID_PREFIX).widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/iOS.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  AirkeepWidgets-macOS:
    type: app-extension
    platform: macOS
    sources: [Shared, Widgets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIRKEEP_BUNDLE_ID_PREFIX).mac.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/macOS.entitlements
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  Airkeep-watchOS:
    type: application
    platform: watchOS
    sources: [Watch, WatchShared, Shared/Models.swift, Shared/Configuration.swift, Shared/RelayClient.swift, Shared/Theme.swift, AppIcon.icon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIRKEEP_BUNDLE_ID_PREFIX).watch
        INFOPLIST_FILE: Watch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/Airkeep.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '4'
        SKIP_INSTALL: YES
    dependencies:
      - target: AirkeepWidgets-watchOS
  AirkeepWidgets-watchOS:
    type: app-extension
    platform: watchOS
    sources: [WatchWidgets, WatchShared, Shared/Models.swift, Shared/Configuration.swift, Shared/RelayClient.swift, Shared/Theme.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIRKEEP_BUNDLE_ID_PREFIX).watch.widgets
        INFOPLIST_FILE: WatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: WatchWidgets/Airkeep.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  AirkeepNotificationsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - WatchShared
      - App/NotificationManager.swift
      - App/AlertRulesModel.swift
      - Shared/Configuration.swift
      - Shared/Models.swift
      - Shared/LiveActivityTiming.swift
      - Shared/ActivityUpdateRegistration.swift
      - Shared/RelayClient.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIRKEEP_BUNDLE_ID_PREFIX).notification-tests
schemes:
  Airkeep-iOS:
    build:
      targets:
        Airkeep-iOS: all
  Airkeep-macOS:
    build:
      targets:
        Airkeep-macOS: all
  Airkeep-watchOS:
    build:
      targets:
        Airkeep-watchOS: all
  AirkeepNotificationsTests:
    build:
      targets:
        AirkeepNotificationsTests: all
    test:
      targets: [AirkeepNotificationsTests]
