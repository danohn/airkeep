name: Airkeep
options:
  bundleIdPrefix: io.airkeep
  deploymentTarget:
    iOS: '26.0'
    macOS: '26.0'
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.1'
    CURRENT_PROJECT_VERSION: '2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Debug:
      APNS_ENVIRONMENT: development
    Release:
      APNS_ENVIRONMENT: production
targets:
  Airkeep-iOS:
    type: application
    platform: iOS
    sources: [Shared, App, iOS, AppIcon.icon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIRKEEP_BUNDLE_ID_PREFIX)
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Airkeep.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AirkeepWidgets-iOS
  Airkeep-macOS:
    type: application
    platform: macOS
    sources: [Shared, App, macOS, AppIcon.icon]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIRKEEP_BUNDLE_ID_PREFIX).mac
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/Airkeep.entitlements
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: AirkeepWidgets-macOS
  AirkeepWidgets-iOS:
    type: app-extension
    platform: iOS
    sources: [Shared, Widgets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIRKEEP_BUNDLE_ID_PREFIX).widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/iOS.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  AirkeepWidgets-macOS:
    type: app-extension
    platform: macOS
    sources: [Shared, Widgets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AIRKEEP_BUNDLE_ID_PREFIX).mac.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/macOS.entitlements
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  Airkeep-iOS:
    build:
      targets:
        Airkeep-iOS: all
  Airkeep-macOS:
    build:
      targets:
        Airkeep-macOS: all
