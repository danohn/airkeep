[project]
name = "airkeep-agent"
version = "0.1.0"
description = "LAN-only Bambu collector for a hosted Airkeep dashboard"
requires-python = ">=3.14"
dependencies = ["paho-mqtt>=2.1,<3", "pydantic>=2.12,<3", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
pythonpath = ["..", "../server"]
testpaths = ["tests"]
