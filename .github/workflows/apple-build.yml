name: Build signed Apple apps

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      build_number:
        required: true
        type: string
      channel:
        required: true
        type: string
      upload_testflight:
        type: boolean
        default: false
    secrets:
      APP_STORE_CONNECT_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_KEY_BASE64:
        required: true
      APPLE_DEVELOPER_ID_CERTIFICATE_BASE64:
        required: false
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD:
        required: false
      APPLE_DEVELOPER_ID_PROFILES_BASE64:
        required: false
      APPLE_STORE_CERTIFICATES_BASE64:
        required: false
      APPLE_STORE_CERTIFICATES_PASSWORD:
        required: false
      APPLE_STORE_PROFILES_BASE64:
        required: false
    outputs:
      revision:
        description: Source commit used to build the apps
        value: ${{ jobs.validate.outputs.revision }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.channels.outputs.matrix }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.15'
          python-version: '3.14'
      - name: Validate source tag, version and build number
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          WORKFLOW_REF: ${{ github.ref }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,3}$ ]]
          revision=$(git rev-parse HEAD)
          if [[ "$WORKFLOW_REF" != refs/heads/main ]]; then
            [[ "$WORKFLOW_REF" == "refs/tags/$RELEASE_TAG" && "$CHANNEL" == mac-direct ]]
            [[ "$revision" == "$GITHUB_SHA" ]]
          fi
          test "$revision" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          uv run --no-project python scripts/check-version.py --tag "$RELEASE_TAG"
          uv run --no-project python scripts/test-apple-release.py
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Select channels
        id: channels
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          uv run --no-project python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          channels = {"all": ["ios-store", "mac-store", "mac-direct"], "store": ["ios-store", "mac-store"], "mac-direct": ["mac-direct"]}
          print("matrix=" + json.dumps({"mode": channels[os.environ["CHANNEL"]]}))
          PY

  build:
    needs: validate
    runs-on: macos-26
    environment: apple-release
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      UPLOAD_TESTFLIGHT: ${{ inputs.upload_testflight }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_BUNDLE_ID_PREFIX: ${{ vars.APPLE_BUNDLE_ID_PREFIX }}
      APPLE_APP_GROUP: ${{ vars.APPLE_APP_GROUP }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      CERTIFICATE_BASE64: ${{ matrix.mode == 'mac-direct' && secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 || secrets.APPLE_STORE_CERTIFICATES_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ matrix.mode == 'mac-direct' && secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD || secrets.APPLE_STORE_CERTIFICATES_PASSWORD }}
      PROFILES_BASE64: ${{ matrix.mode == 'mac-direct' && secrets.APPLE_DEVELOPER_ID_PROFILES_BASE64 || secrets.APPLE_STORE_PROFILES_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.15'
          python-version: '3.14'
      - name: Check Xcode SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Test shared Apple code
        run: xcodebuild -project apple/Airkeep.xcodeproj -scheme AirkeepNotificationsTests -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
      - name: Archive, sign and export
        env:
          RELEASE_MODE: ${{ matrix.mode }}
        run: bash scripts/apple-release.sh "$RELEASE_MODE"
      - name: Attest final stapled DMG
        if: matrix.mode == 'mac-direct'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/airkeep-release-mac-direct/output/*.dmg
      - name: Save DMG attestation bundle
        if: matrix.mode == 'mac-direct'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$RUNNER_TEMP/airkeep-release-mac-direct/output/attestation.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apple-${{ matrix.mode }}-${{ inputs.tag }}-build${{ inputs.build_number }}
          path: ${{ runner.temp }}/airkeep-release-${{ matrix.mode }}/output/
          if-no-files-found: error
          retention-days: 30
