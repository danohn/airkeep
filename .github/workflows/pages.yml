name: Landing page

on:
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'design/brand/fonts/OFL.txt'
      - 'design/brand/logo/airkeep-mark-amber.svg'
      - 'design/brand/github/social-preview.png'
      - 'docs/screenshots/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'site/**'
      - 'design/brand/fonts/OFL.txt'
      - 'design/brand/logo/airkeep-mark-amber.svg'
      - 'design/brand/github/social-preview.png'
      - 'docs/screenshots/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage the landing page
        run: bash site/build.sh "$RUNNER_TEMP/airkeep-pages"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/airkeep-pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
