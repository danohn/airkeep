name: Landing page

on:
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'scripts/download-firmware-releases.sh'
      - 'site/**'
      - 'design/brand/fonts/OFL.txt'
      - 'design/brand/logo/airkeep-mark-amber.svg'
      - 'design/brand/github/social-preview.png'
      - 'docs/screenshots/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'scripts/download-firmware-releases.sh'
      - 'site/**'
      - 'design/brand/fonts/OFL.txt'
      - 'design/brand/logo/airkeep-mark-amber.svg'
      - 'design/brand/github/social-preview.png'
      - 'docs/screenshots/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - name: Test the installer and simulated USB setup
        if: github.event_name == 'pull_request'
        run: |
          npm exec --prefix site -- playwright install --with-deps chromium
          npm test --prefix site
      - name: Download released firmware
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/download-firmware-releases.sh "$RUNNER_TEMP/firmware-releases"
      - name: Stage the landing page
        run: |
          mkdir -p "$RUNNER_TEMP/firmware-releases"
          bash site/build.sh "$RUNNER_TEMP/airkeep-pages" "$RUNNER_TEMP/firmware-releases"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/airkeep-pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
