name: Container images

on:
  pull_request:
    paths:
      - '.github/workflows/containers.yml'
      - '.dockerignore'
      - '.bumpversion.toml'
      - 'apple/project.yml'
      - 'apple/Airkeep.xcodeproj/project.pbxproj'
      - 'firmware/version.txt'
      - 'server/**'
      - 'agent/**'
      - 'web/**'
      - 'scripts/check-containers.py'
      - 'scripts/check-version.py'
      - 'scripts/release-image-digest.sh'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/containers.yml'
      - '.dockerignore'
      - 'server/**'
      - 'agent/**'
      - 'web/**'
      - 'scripts/check-containers.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: airkeep-ci-migration
          POSTGRES_DB: airkeep_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d airkeep_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.ref_type == 'tag' && '0' || '1' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.15'
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check release version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            git merge-base --is-ancestor HEAD origin/main
            uv run --no-project python scripts/check-version.py --tag "$GITHUB_REF_NAME"
          else
            uv run --no-project python scripts/check-version.py
          fi
      - name: Relay and hosted PostgreSQL tests
        env:
          AIRKEEP_MIGRATION_DATABASE_URL: postgresql://postgres:airkeep-ci-migration@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/airkeep_test
          AIRKEEP_TEST_DATABASE_URL: postgresql://airkeep_runtime:airkeep-ci-runtime@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/airkeep_test
        run: |
          uv run --locked --directory server python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ['AIRKEEP_MIGRATION_DATABASE_URL']) as connection:
              connection.execute("CREATE ROLE airkeep_runtime LOGIN PASSWORD 'airkeep-ci-runtime' NOSUPERUSER NOBYPASSRLS")
          PY
          uv run --locked --directory server python migrate.py
          uv run --locked --directory server pytest -q
      - name: Browser tests
        run: npm ci --prefix web && npm test --prefix web
      - name: Build images
        run: |
          docker build -f server/Dockerfile -t airkeep-relay:ci .
          docker build -f web/Dockerfile -t airkeep-web:ci .
      - name: Check HTTPS and browser access
        run: uv run --locked --directory server python ../scripts/check-containers.py --relay-image airkeep-relay:ci --web-image airkeep-web:ci

  publish:
    needs: checks
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: airkeep-relay
            dockerfile: server/Dockerfile
          - image: airkeep-web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image source
        id: source
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ steps.source.outputs.owner }}/${{ matrix.image }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Check for an existing release image
        id: release-image
        if: github.ref_type == 'tag'
        env:
          OWNER: ${{ steps.source.outputs.owner }}
          IMAGE: ${{ matrix.image }}
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          version=${GITHUB_REF_NAME#v}
          image="ghcr.io/$OWNER/$IMAGE"
          if docker buildx imagetools inspect "$image:$version" --raw > /dev/null 2> "$RUNNER_TEMP/inspect-error"; then
            bash scripts/release-image-digest.sh "$image" "$version" "$REVISION"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'not found|manifest unknown' "$RUNNER_TEMP/inspect-error"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/inspect-error" >&2
            exit 1
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.release-image.outputs.exists != 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: mode=max
          sbom: true

  firmware:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/firmware.yml

  release:
    needs: [publish, firmware]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: firmware-release
          path: ${{ runner.temp }}/firmware-release
      - name: Verify images and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version=${GITHUB_REF_NAME#v}
          revision=$(git rev-parse HEAD)
          relay="ghcr.io/${OWNER,,}/airkeep-relay"
          web="ghcr.io/${OWNER,,}/airkeep-web"
          relay_digest=$(bash scripts/release-image-digest.sh "$relay" "$version" "$revision")
          web_digest=$(bash scripts/release-image-digest.sh "$web" "$version" "$revision")
          verify_firmware() (
            cd "$1"
            test -s FLASHING.md
            test "$(sha256sum airkeep-factory.bin)" = "$(cat SHA256SUMS.txt)"
          )
          bundle="$RUNNER_TEMP/firmware-release"
          verify_firmware "$bundle"
          if gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease' > "$RUNNER_TEMP/release-state" 2> "$RUNNER_TEMP/release-error"; then
            if [[ $(cat "$RUNNER_TEMP/release-state") == false ]]; then
              published="$RUNNER_TEMP/published-firmware"
              gh release download "$GITHUB_REF_NAME" --dir "$published" \
                --pattern airkeep-factory.bin --pattern SHA256SUMS.txt --pattern FLASHING.md
              verify_firmware "$published"
              exit 0
            fi
            echo "A draft or prerelease already exists for $GITHUB_REF_NAME. Review it before publishing." >&2
            exit 1
          elif ! grep -qi 'release not found' "$RUNNER_TEMP/release-error"; then
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi
          {
            printf 'Both container images were built from commit `%s`.\n\n' "$revision"
            printf '| Service | Image tag | Image index digest |\n| --- | --- | --- |\n'
            printf '| Relay | `%s:%s` | `%s` |\n' "$relay" "$version" "$relay_digest"
            printf '| Dashboard | `%s:%s` | `%s` |\n\n' "$web" "$version" "$web_digest"
            printf 'Set `AIRKEEP_IMAGE_TAG=%s` to deploy both images together. See the [upgrade and rollback guide](https://github.com/%s/blob/%s/docs/docker-deployment.md#updates-and-rollback).\n\n' "$version" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            printf 'The factory firmware supports the Waveshare ESP32-S3-Touch-AMOLED-1.8 V2. Use the [web installer](https://airkeep.io/install/) or the attached flashing instructions. Factory installation clears saved settings and pairing.\n'
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Airkeep $version" \
            --generate-notes --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$bundle/airkeep-factory.bin" "$bundle/SHA256SUMS.txt" "$bundle/FLASHING.md"

  deploy-installer:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Request deployment of the released installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
