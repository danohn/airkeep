name: Apple signed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable vX.Y.Z tag on main
        required: true
        type: string
      build_number:
        description: Unused positive Apple build number for this version
        required: true
        type: string
      channel:
        description: Distribution channels to build
        type: choice
        default: all
        options: [all, store, mac-direct]
      upload_testflight:
        description: Upload Store builds to App Store Connect for TestFlight processing
        type: boolean
        default: false
      publish_dmg:
        description: Publish a separate macOS release for this build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Validate standalone release options
        env:
          CHANNEL: ${{ inputs.channel }}
          PUBLISH_DMG: ${{ inputs.publish_dmg }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$CHANNEL" != store || "$PUBLISH_DMG" != true ]]

  build:
    needs: prepare
    uses: ./.github/workflows/apple-build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      tag: ${{ inputs.tag }}
      build_number: ${{ inputs.build_number }}
      channel: ${{ inputs.channel }}
      upload_testflight: ${{ inputs.upload_testflight }}
    secrets:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_DEVELOPER_ID_PROFILES_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_PROFILES_BASE64 }}
      APPLE_STORE_CERTIFICATES_BASE64: ${{ secrets.APPLE_STORE_CERTIFICATES_BASE64 }}
      APPLE_STORE_CERTIFICATES_PASSWORD: ${{ secrets.APPLE_STORE_CERTIFICATES_PASSWORD }}
      APPLE_STORE_PROFILES_BASE64: ${{ secrets.APPLE_STORE_PROFILES_BASE64 }}

  publish-dmg:
    needs: build
    if: inputs.publish_dmg
    runs-on: ubuntu-latest
    environment: apple-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apple-mac-direct-${{ inputs.tag }}-build${{ inputs.build_number }}
          path: release
      - name: Verify and publish the notarized DMG
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          version=${RELEASE_TAG#v}
          asset="Airkeep-$version-build$BUILD_NUMBER"
          mac_tag="apple-$RELEASE_TAG-build$BUILD_NUMBER"
          gh attestation verify "$asset.dmg" --repo "$GH_REPO" --bundle attestation.json \
            --signer-workflow "$GH_REPO/.github/workflows/apple-build.yml"
          commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          [[ "$commit" == "$REVISION" ]]
          mv SHA256SUMS.txt "$asset-SHA256SUMS.txt"
          mv attestation.json "$asset-attestation.json"
          gh release create "$mac_tag" --draft --latest=false --target "$commit" \
            --title "Airkeep $version for macOS (build $BUILD_NUMBER)" --notes-file - \
            "$asset.dmg" "$asset-SHA256SUMS.txt" "$asset-attestation.json" <<EOF
          Developer ID-signed and notarized Airkeep for Apple silicon and Intel Macs running macOS 26 or later.

          [Build and notarization run](https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID) · [Airkeep $version source](https://github.com/$GH_REPO/tree/$RELEASE_TAG)
          EOF
          gh release edit "$mac_tag" --draft=false --latest=false
