name: Apple signed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable vX.Y.Z tag on main
        required: true
        type: string
      build_number:
        description: Unused positive Apple build number for this version
        required: true
        type: string
      channel:
        description: Distribution channels to build
        type: choice
        default: all
        options: [all, store, mac-direct]
      upload_testflight:
        description: Upload Store builds to App Store Connect for TestFlight processing
        type: boolean
        default: false
      publish_dmg:
        description: Publish the notarized DMG as a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.channels.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.15'
          python-version: '3.14'
      - name: Validate source tag, version and build number
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          WORKFLOW_REF: ${{ github.ref }}
          CHANNEL: ${{ inputs.channel }}
          PUBLISH_DMG: ${{ inputs.publish_dmg }}
        run: |
          [[ "$WORKFLOW_REF" == refs/heads/main ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,3}$ ]]
          [[ "$CHANNEL" != store || "$PUBLISH_DMG" != true ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          uv run --no-project python scripts/check-version.py --tag "$RELEASE_TAG"
          uv run --no-project python scripts/test-apple-release.py
      - name: Select channels
        id: channels
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          uv run --no-project python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          channels = {"all": ["ios-store", "mac-store", "mac-direct"], "store": ["ios-store", "mac-store"], "mac-direct": ["mac-direct"]}
          print("matrix=" + json.dumps({"mode": channels[os.environ["CHANNEL"]]}))
          PY

  build:
    needs: validate
    runs-on: macos-26
    environment: apple-release
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      UPLOAD_TESTFLIGHT: ${{ inputs.upload_testflight }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_BUNDLE_ID_PREFIX: ${{ vars.APPLE_BUNDLE_ID_PREFIX }}
      APPLE_APP_GROUP: ${{ vars.APPLE_APP_GROUP }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      CERTIFICATE_BASE64: ${{ matrix.mode == 'mac-direct' && secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 || secrets.APPLE_STORE_CERTIFICATES_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ matrix.mode == 'mac-direct' && secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD || secrets.APPLE_STORE_CERTIFICATES_PASSWORD }}
      PROFILES_BASE64: ${{ matrix.mode == 'mac-direct' && secrets.APPLE_DEVELOPER_ID_PROFILES_BASE64 || secrets.APPLE_STORE_PROFILES_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.15'
          python-version: '3.14'
      - name: Check Xcode SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Test shared Apple code
        run: xcodebuild -project apple/Airkeep.xcodeproj -scheme AirkeepNotificationsTests -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
      - name: Archive, sign and export
        env:
          RELEASE_MODE: ${{ matrix.mode }}
        run: bash scripts/apple-release.sh "$RELEASE_MODE"
      - name: Attest final stapled DMG
        if: matrix.mode == 'mac-direct'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/airkeep-release-mac-direct/output/*.dmg
      - name: Save DMG attestation bundle
        if: matrix.mode == 'mac-direct'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$RUNNER_TEMP/airkeep-release-mac-direct/output/attestation.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apple-${{ matrix.mode }}-${{ inputs.tag }}-build${{ inputs.build_number }}
          path: ${{ runner.temp }}/airkeep-release-${{ matrix.mode }}/output/
          if-no-files-found: error
          retention-days: 30

  publish-dmg:
    needs: build
    if: inputs.publish_dmg
    runs-on: ubuntu-latest
    environment: apple-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: apple-mac-direct-${{ inputs.tag }}-build${{ inputs.build_number }}
          path: release
      - name: Verify and publish the notarized DMG
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          version=${RELEASE_TAG#v}
          asset="Airkeep-$version-build$BUILD_NUMBER"
          mac_tag="apple-$RELEASE_TAG-build$BUILD_NUMBER"
          gh attestation verify "$asset.dmg" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/apple-release.yml"
          commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          mv SHA256SUMS.txt "$asset-SHA256SUMS.txt"
          mv attestation.json "$asset-attestation.json"
          gh release create "$mac_tag" --draft --latest=false --target "$commit" \
            --title "Airkeep $version for macOS (build $BUILD_NUMBER)" --notes-file - \
            "$asset.dmg" "$asset-SHA256SUMS.txt" "$asset-attestation.json" <<EOF
          Developer ID-signed and notarized Airkeep for Apple silicon and Intel Macs running macOS 26 or later.

          [Build and notarization run](https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID) · [Airkeep $version source](https://github.com/$GH_REPO/tree/$RELEASE_TAG)
          EOF
          gh release edit "$mac_tag" --draft=false --latest=false
