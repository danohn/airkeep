name: ESP32 firmware

on:
  pull_request:
    paths:
      - 'firmware/**'
      - 'scripts/package-firmware.py'
      - '.github/workflows/firmware.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    env:
      ESP_IDF_VERSION: v5.5.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.15'
          python-version: '3.14'
      - name: Cache ESP32-S3 compiler outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/firmware-ci/ccache
          key: esp32s3-ccache-${{ runner.os }}-${{ runner.arch }}-${{ env.ESP_IDF_VERSION }}-${{ hashFiles('firmware/**') }}
          restore-keys: esp32s3-ccache-${{ runner.os }}-${{ runner.arch }}-${{ env.ESP_IDF_VERSION }}-
      - name: Build clean ESP32-S3 firmware
        run: |
          mkdir -p .local/firmware-ci/ccache
          docker run --rm -e IDF_GIT_SAFE_DIR=/project \
            -e CCACHE_DIR=/project/.local/firmware-ci/ccache \
            -e CCACHE_MAXSIZE=250M -e CCACHE_UMASK=022 \
            -v "$GITHUB_WORKSPACE:/project" -w /project/firmware \
            "espressif/idf:$ESP_IDF_VERSION" bash -ec '
              ccache --zero-stats
              idf.py build
              ccache --show-stats
              cp -R "$IDF_PATH/components/json/cJSON" /project/.local/firmware-ci/cjson
            '
      - name: Run firmware host tests
        run: |
          cmake -S firmware/preview -B .local/firmware-ci/host -G Ninja \
            -DAIRKEEP_CJSON_DIR="$GITHUB_WORKSPACE/.local/firmware-ci/cjson"
          cmake --build .local/firmware-ci/host
          ctest --test-dir .local/firmware-ci/host --output-on-failure
      - name: Package factory image and checksum
        run: uv run --no-project --with esptool==5.6.0 python scripts/package-firmware.py firmware/build .local/firmware-ci/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firmware-release
          path: .local/firmware-ci/release/
          if-no-files-found: error
