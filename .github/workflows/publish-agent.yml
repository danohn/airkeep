name: Airkeep Python package

on:
  pull_request:
    paths: ['agent/**', '.github/workflows/publish-agent.yml']
  push:
    branches: ['**']
    tags: ['agent-v*']
    paths: ['agent/**', '.github/workflows/publish-agent.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.15'
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: uv run --locked --directory agent pytest -q
      - name: Check release tag
        if: github.ref_type == 'tag'
        run: |
          version=$(uv run --locked --directory agent python -c 'from importlib.metadata import version; print(version("airkeep"))')
          if [[ "$GITHUB_REF_NAME" != "agent-v$version" ]]; then
            echo "Release tag must be agent-v$version." >&2
            exit 1
          fi
      - run: uv build agent --out-dir dist
      - name: Test installed wheel
        run: |
          wheel=("$PWD"/dist/*.whl)
          cd "$RUNNER_TEMP"
          uvx --from "${wheel[0]}" airkeep --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: airkeep-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/agent-v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/airkeep/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: airkeep-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
