location = /web-health { return 200 "ok\n"; }
location = / { try_files /index.html =404; }
location = /signup { try_files /index.html =404; }
location = /signup/complete { try_files /index.html =404; }
location = /forgot-password { try_files /index.html =404; }
location = /reset-password { try_files /index.html =404; }
location = /account { try_files /index.html =404; }
location = /setup { try_files /index.html =404; }
location = /connect { try_files /index.html =404; }
location = /device { try_files /index.html =404; }
location = /invite { try_files /index.html =404; }
location = /login/sso { try_files /index.html =404; }
location = /auth/callback { try_files /index.html =404; }
location = /index.html { try_files $uri =404; }
location /assets/ { try_files $uri =404; }
location /brand/ { try_files $uri =404; }

location ~ ^/(v1|v2|auth)(/|$) {
    include /etc/airkeep/proxy.conf;
}
location = /health {
    include /etc/airkeep/proxy.conf;
}
location / { return 404; }
