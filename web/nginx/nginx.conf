worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    root /usr/share/nginx/html;
    access_log off;
    server_tokens off;
    client_max_body_size 16k;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=30s ipv6=off;

    map "$status:$uri" $airkeep_cache_control {
        default "no-cache";
        ~^(200|304):/assets/ "public, max-age=31536000, immutable";
        ~^[0-9]+:/(v1|v2|auth)(/|$) "no-store";
    }
    add_header Cache-Control $airkeep_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    server {
        listen 8080 default_server;
        include /etc/airkeep/locations.conf;
    }
    include /tmp/airkeep-tls.conf;
}
